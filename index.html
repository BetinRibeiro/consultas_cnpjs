<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Scraper | High Performance</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Inter', sans-serif; }
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.95); z-index: 9999;
            display: none; align-items: center; justify-content: center; flex-direction: column;
        }
        .progress-container { width: 80%; max-width: 500px; margin-top: 20px; }
        .btn-success { background-color: #28a745; border: none; border-radius: 20px; padding: 8px 20px; }
        .card { border: none; border-radius: 15px; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); }
        .cnpj-badge { font-family: monospace; background: #e9ecef; padding: 4px 8px; border-radius: 5px; }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner-border text-success" role="status"></div>
    <h5 class="mt-3" id="loaderText">Processando...</h5>
    <div class="progress-container">
        <div class="progress" style="height: 25px;">
            <div id="progressBar" class="progress-bar progress-bar-striped progress-bar-animated bg-success" style="width: 0%"></div>
        </div>
        <div class="d-flex justify-content-between mt-2">
            <small id="progressPercent" class="fw-bold text-success">0%</small>
            <small id="progressRows" class="text-muted">0 registros</small>
        </div>
    </div>
</div>

<div class="container-fluid pt-3 px-3">
    <div class="card p-3 mb-3">
        <div class="row align-items-center">
            <div class="col-md-6">
                <label class="small fw-bold text-muted text-uppercase">Importar CSV:</label>
                <input type="file" id="csvInput" class="form-control border-success" accept=".csv" disabled>
            </div>
            <div class="col-md-6 text-md-end mt-2 mt-md-0">
                <button class="btn btn-outline-danger btn-sm" onclick="limparBanco()">Limpar Banco</button>
            </div>
        </div>
    </div>

    <div class="card p-4">
        <div class="row mb-4">
            <div class="col-md-6">
                <h5 class="fw-bold m-0">LEADS EXPLORER</h5>
                <small id="totalCount" class="text-muted">Aguardando...</small>
            </div>
            <div class="col-md-6">
                <div class="input-group">
                    <input type="text" class="form-control" id="txtBusca" placeholder="Pesquisar nos dados carregados...">
                    <button class="btn btn-success" onclick="resetPaginaEBucar()">Buscar</button>
                </div>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover align-middle">
                <thead>
                    <tr>
                        <th>CNPJ / WhatsApp</th>
                        <th>Empresa / Razão Social</th>
                        <th>CNAE</th>
                        <th>Localização</th>
                    </tr>
                </thead>
                <tbody id="listaLeads">
                    <tr><td colspan="3" class="text-center py-5 text-muted">A tabela está vazia. Importe um arquivo ou faça uma busca.</td></tr>
                </tbody>
            </table>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-4">
            <button class="btn btn-outline-secondary btn-sm" id="btnAnterior" onclick="mudarPagina(-1)" disabled>Anterior</button>
            <span id="pageInfo" class="fw-bold">Página 1</span>
            <button class="btn btn-outline-secondary btn-sm" id="btnProximo" onclick="mudarPagina(1)" disabled>Próximo</button>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
    const DB_NAME = 'LeadScraperDB';
    const STORE_NAME = 'leads';
    let db = null;
    let currentPage = 0;
    const pageSize = 300;

    // Aumentei a versão para 10 para evitar o VersionError anterior
    function initDB() {
        const request = indexedDB.open(DB_NAME, 10);

        request.onupgradeneeded = (e) => {
            const dbRes = e.target.result;
            if (!dbRes.objectStoreNames.contains(STORE_NAME)) {
                dbRes.createObjectStore(STORE_NAME, { keyPath: 'CNPJ' });
            }

        };

        request.onsuccess = (e) => {
            db = e.target.result;
            document.getElementById('csvInput').disabled = false;
            atualizarContagemTotal();
            // REMOVIDO: carregarLeads() automático. A tabela inicia vazia.
        };

        request.onerror = (e) => {
            console.error("Erro ao abrir banco:", e.target.error);
            alert("Erro de versão do banco. Limpe o cache do navegador ou mude o nome da constante DB_NAME.");
        };
    }

    function atualizarContagemTotal() {
        if (!db) return;
        const store = db.transaction([STORE_NAME], 'readonly').objectStore(STORE_NAME);
        const req = store.count();
        req.onsuccess = () => {
            document.getElementById('totalCount').innerText = `${req.result.toLocaleString('pt-BR')} registros armazenados no total.`;
        };
    }

    document.getElementById('csvInput').onchange = (e) => {
        const file = e.target.files[0];
        if (!file || !db) return;

        const loader = document.getElementById('loader');
        const progressBar = document.getElementById('progressBar');
        const progressPercent = document.getElementById('progressPercent');
        const progressRows = document.getElementById('progressRows');
        
        loader.style.display = 'flex';
        let totalRowsProcessed = 0;

        Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            chunkSize: 1024 * 1024 * 2,
            chunk: (results, parser) => {
                parser.pause();
                const tx = db.transaction([STORE_NAME], 'readwrite');
                const store = tx.objectStore(STORE_NAME);

                results.data.forEach(item => {
                    let cnpjKey = Object.keys(item).find(k => k.trim().toUpperCase() === 'CNPJ');
                    if (cnpjKey && item[cnpjKey]) {
                        item['CNPJ'] = item[cnpjKey];
                        store.put(item);
                        totalRowsProcessed++;
                    }
                });

                tx.oncomplete = () => {
                    const percent = Math.round((results.meta.cursor / file.size) * 100);
                    progressBar.style.width = percent + '%';
                    progressPercent.innerText = percent + '%';
                    progressRows.innerText = totalRowsProcessed.toLocaleString('pt-BR') + ' registros';
                    setTimeout(() => parser.resume(), 10);
                };
                tx.onerror = () => parser.resume();
            },
            complete: () => {
                setTimeout(() => {
                    alert("Importação Concluída: " + totalRowsProcessed + " registros.");
                    location.reload(); // Recarrega para limpar o input e atualizar contagem
                }, 500);
            }
        });
    };

    function carregarLeads() {
        if (!db) return;
        const searchTerm = document.getElementById('txtBusca').value.toLowerCase().trim();
        const store = db.transaction([STORE_NAME], 'readonly').objectStore(STORE_NAME);
        const list = document.getElementById('listaLeads');
        
        let skip = currentPage * pageSize;
        let countMatches = 0;
        let displayed = 0;
        let hasMore = false;

        list.innerHTML = '';

        store.openCursor().onsuccess = (event) => {
            const cursor = event.target.result;
            if (!cursor) {
                if (displayed === 0) list.innerHTML = '<tr><td colspan="3" class="text-center py-5">Nenhum resultado encontrado para esta busca.</td></tr>';
                document.getElementById('btnProximo').disabled = !hasMore;
                document.getElementById('btnAnterior').disabled = currentPage === 0;
                document.getElementById('pageInfo').innerText = `Página ${currentPage + 1}`;
                return;
            }

            const data = cursor.value;
            // Busca simplificada em todo o conteúdo do registro
            const content = JSON.stringify(data).toLowerCase();
            const match = searchTerm === "" || content.includes(searchTerm);

            if (match) {
                if (countMatches >= skip && displayed < pageSize) {
                    renderRow(data);
                    displayed++;
                } else if (countMatches >= skip + pageSize) {
                    hasMore = true;
                    if (searchTerm === "") { // Performance: se não houver busca, para o cursor
                        document.getElementById('btnProximo').disabled = false;
                        return;
                    }
                }
                countMatches++;
            }
            cursor.continue();
        };
    }

    function renderRow(row) {
        const list = document.getElementById('listaLeads');
        const tr = document.createElement('tr');
        
        const getVal = (names) => {
            for(let n of names) {
                let key = Object.keys(row).find(k => k.trim().toUpperCase() === n.toUpperCase());
                if(key) return row[key];
            }
            return '-';
        };

        const razao = getVal(['RAZAO SOCIAL', 'NOME', 'RAZAO']);
        const telefone = getVal(['TELEFONE', 'CELULAR', 'FONE', 'CONTATO']).toString();
        const cidade = getVal(['CIDADE']);
        const uf = getVal(['UF', 'ESTADO']);

       tr.innerHTML = `
            <td>
                <div class="cnpj-badge small">${row.CNPJ || ''}</div>
                <div class="mt-1">
                    <a href="https://wa.me/${(row.TELEFONE || '').replace(/\D/g,'')}" target="_blank" class="text-success text-decoration-none small">
                        <i class="fa fa-whatsapp"></i> ${row.TELEFONE || '-'}
                    </a>
                </div>
            </td>
            <td>
                <div class="fw-bold">${row['RAZAO SOCIAL'] || 'N/A'}</div>
                <div class="text-muted small">${row['FANTASIA'] || '-'}</div>
            </td>
            <td class="hide-mobile small">${row['DESC CNAE'] || '-'}</td>
            <td class="hide-mobile small">
                ${row.CIDADE || '-'} / ${row.UF || '-'} <br>
                <span class="text-muted">${row.BAIRRO || ''}</span>
            </td>
        `;
        list.appendChild(tr);
    }

    function mudarPagina(dir) { currentPage += dir; carregarLeads(); window.scrollTo(0,0); }
    function resetPaginaEBucar() { currentPage = 0; carregarLeads(); }
    function limparBanco() { if(confirm("Apagar todos os dados?")) { 
        db.transaction([STORE_NAME], 'readwrite').objectStore(STORE_NAME).clear().oncomplete = () => location.reload();
    }}

    initDB();
    
</script>
</body>
</html>
