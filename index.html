<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lead Scraper | High Performance</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        body { background-color: #f4f7f6; font-family: 'Inter', sans-serif; }
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255,255,255,0.9); z-index: 9999;
            display: none; align-items: center; justify-content: center; flex-direction: column;
        }
        .btn-success { background-color: #28a745; border: none; border-radius: 20px; padding: 8px 20px; }
        .card { border: none; border-radius: 15px; box-shadow: 0 0.125rem 0.25rem rgba(0, 0, 0, 0.075); }
        .table { font-size: 0.9rem; }
        .cnpj-badge { font-family: monospace; background: #e9ecef; padding: 4px 8px; border-radius: 5px; }
        @media (max-width: 768px) { .hide-mobile { display: none; } }
    </style>
</head>
<body>

<div id="loader">
    <div class="spinner-border text-success" role="status"></div>
    <h5 class="mt-3">Processando Dados...</h5>
</div>

<div class="container-fluid pt-3 px-3">
    <div class="card p-3 mb-3">
        <div class="row align-items-center">
            <div class="col-md-6">
                <label class="small fw-bold text-muted text-uppercase">Importar Seu CSV:</label>
                <input type="file" id="csvInput" class="form-control border-success" accept=".csv">
            </div>
            <div class="col-md-6 text-md-end mt-2 mt-md-0">
                <button class="btn btn-outline-danger btn-sm" onclick="limparBanco()">Limpar Banco</button>
            </div>
        </div>
    </div>

    <div class="card p-4">
        <div class="row mb-4">
            <div class="col-md-5">
                <h5 class="fw-bold">LISTAGEM DE LEADS <small id="totalCount" class="text-muted"></small></h5>
            </div>
            <div class="col-md-7">
                <div class="input-group">
                    <input type="text" class="form-control" id="txtBusca" placeholder="Busca por CNPJ, Nome, Cidade...">
                    <button class="btn btn-success" onclick="resetPaginaEBucar()">Buscar</button>
                </div>
            </div>
        </div>

        <div class="table-responsive">
            <table class="table table-hover">
                <thead>
                    <tr>
                        <th>CNPJ / Contato</th>
                        <th>Razão Social</th>
                        <th class="hide-mobile">CNAE</th>
                        <th class="hide-mobile">Localização</th>
                    </tr>
                </thead>
                <tbody id="listaLeads"></tbody>
            </table>
        </div>

        <div class="d-flex justify-content-between align-items-center mt-4">
            <button class="btn btn-outline-secondary btn-sm" id="btnAnterior" onclick="mudarPagina(-1)">Anterior</button>
            <span id="pageInfo">Página 1</span>
            <button class="btn btn-outline-secondary btn-sm" id="btnProximo" onclick="mudarPagina(1)">Próximo</button>
        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

<script>
    const DB_NAME = 'LeadScraperDB';
    const STORE_NAME = 'leads';
    let db;
    let currentPage = 0;
    const pageSize = 50;

    // Inicializa IndexedDB
    const request = indexedDB.open(DB_NAME, 1);
    request.onupgradeneeded = (e) => {
        const dbRes = e.target.result;
        if (!dbRes.objectStoreNames.contains(STORE_NAME)) {
            dbRes.createObjectStore(STORE_NAME, { keyPath: 'CNPJ' });
        }
    };
    request.onsuccess = (e) => {
        db = e.target.result;
        carregarLeads();
    };

    function resetPaginaEBucar() {
        currentPage = 0;
        carregarLeads();
    }

    function carregarLeads() {
        const searchTerm = document.getElementById('txtBusca').value.toLowerCase();
        const transaction = db.transaction([STORE_NAME], 'readonly');
        const store = transaction.objectStore(STORE_NAME);
        const list = document.getElementById('listaLeads');
        list.innerHTML = '';
        
        let skip = currentPage * pageSize;
        let count = 0;
        let displayed = 0;

        store.openCursor().onsuccess = (event) => {
            const cursor = event.target.result;
            
            if (!cursor) {
                document.getElementById('btnProximo').disabled = displayed < pageSize;
                document.getElementById('btnAnterior').disabled = currentPage === 0;
                document.getElementById('pageInfo').innerText = `Página ${currentPage + 1}`;
                return;
            }

            const data = cursor.value;
            const match = !searchTerm || 
                          (data.CNPJ && data.CNPJ.includes(searchTerm)) || 
                          (data['RAZAO SOCIAL'] && data['RAZAO SOCIAL'].toLowerCase().includes(searchTerm)) ||
                          (data['CIDADE'] && data['CIDADE'].toLowerCase().includes(searchTerm));

            if (match) {
                if (count >= skip && displayed < pageSize) {
                    renderRow(data);
                    displayed++;
                }
                count++;
            }

            // Otimização: Se já preenchemos a página e não estamos buscando o total, 
            // poderíamos parar aqui. Mas para simplificar e manter a lógica de busca:
            if (displayed < pageSize || searchTerm) {
                cursor.continue();
            } else {
                // Se não há busca, não precisamos percorrer o resto do banco
                document.getElementById('btnProximo').disabled = false;
            }
        };
    }

    function renderRow(row) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td>
                <div class="cnpj-badge small">${row.CNPJ || ''}</div>
                <div class="mt-1">
                    <a href="https://wa.me/${(row.TELEFONE || '').replace(/\D/g,'')}" target="_blank" class="text-success text-decoration-none small">
                        <i class="fa fa-whatsapp"></i> ${row.TELEFONE || '-'}
                    </a>
                </div>
            </td>
            <td>
                <div class="fw-bold">${row['RAZAO SOCIAL'] || 'N/A'}</div>
                <div class="text-muted small">${row['FANTASIA'] || '-'}</div>
            </td>
            <td class="hide-mobile small">${row['DESC CNAE'] || '-'}</td>
            <td class="hide-mobile small">
                ${row.CIDADE || '-'} / ${row.UF || '-'} <br>
                <span class="text-muted">${row.BAIRRO || ''}</span>
            </td>
        `;
        document.getElementById('listaLeads').appendChild(tr);
    }

    function mudarPagina(dir) {
        currentPage += dir;
        carregarLeads();
        window.scrollTo(0,0);
    }

    // Importação de CSV
    document.getElementById('csvInput').onchange = (e) => {
        const file = e.target.files[0];
        if(!file) return;
        
        document.getElementById('loader').style.display = 'flex';

        Papa.parse(file, {
            header: true,
            skipEmptyLines: true,
            chunkSize: 1024 * 1024 * 2, // 2MB por vez
            chunk: (results) => {
                const tx = db.transaction([STORE_NAME], 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                results.data.forEach(item => {
                    if(item.CNPJ) store.put(item);
                });
            },
            complete: () => {
                alert("Importação concluída!");
                location.reload();
            }
        });
    };

    function limparBanco() {
        if(confirm("Apagar todos os dados?")) {
            const tx = db.transaction([STORE_NAME], 'readwrite');
            tx.objectStore(STORE_NAME).clear();
            tx.oncomplete = () => location.reload();
        }
    }
</script>
</body>
</html>
